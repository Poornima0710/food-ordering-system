<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Product List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: pink;
            padding: 20px;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .product {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .product img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #ddd;
            padding-bottom: 16px;
            transition: transform 0.3s ease; /* Smooth zoom effect */
}

.product:hover img {
    transform: scale(1.2); /* Zoom in the image when hovered */
}
        .product .name {
            font-size: 1.2em;
            margin-top: 8px;
        }
        .product .cost {
            color: #555;
            margin-top: 4px;
        }
        .product .add-to-cart-button, .product .remove-from-cart-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .product .add-to-cart-button:hover, .product .remove-from-cart-button:hover {
            background-color: #0056b3;
        }
        .product .remove-from-cart-button {
            background-color: #f44336;
            display: none;
        }

        /* Center Button Style */
        .center-button {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
    width: 100%;
}

.center-button button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
}

.center-button button:hover {
    background-color: #0056b3;
}
    </style>
</head>

    <!-- JavaScript for cart functionality -->
    <script>
        // Clear cart and total cost on page load
        window.onload = function() {
            localStorage.removeItem('orderDetails');
            localStorage.removeItem('totalCost');
        };

        function addToCart(productName, productCost, productImage) {
            let orderDetails = JSON.parse(localStorage.getItem('orderDetails')) || [];
            orderDetails.push({ name: productName, cost: productCost, image: productImage });
            localStorage.setItem('orderDetails', JSON.stringify(orderDetails));

            let totalCost = parseFloat(localStorage.getItem('totalCost')) || 0;
            totalCost += productCost;
            localStorage.setItem('totalCost', totalCost.toFixed(2));

            showNotification('${productName} added to cart!');
            updateTotalCostUI();
            

            // Show remove button for the added product
            const productElements = document.querySelectorAll('.product');
            productElements.forEach(product => {
                if (product.querySelector('.name').textContent === productName) {
                    product.querySelector('.remove-from-cart-button').style.display = 'block';
                }
            });
        }

        function removeFromCart(productName, productCost) {
            let orderDetails = JSON.parse(localStorage.getItem('orderDetails')) || [];
            orderDetails = orderDetails.filter(item => item.name !== productName);
            localStorage.setItem('orderDetails', JSON.stringify(orderDetails));

            let totalCost = parseFloat(localStorage.getItem('totalCost')) || 0;
            totalCost -= productCost;
            localStorage.setItem('totalCost', totalCost.toFixed(2));

            showNotification('${productName} removed from cart!');
            updateTotalCostUI();

            // Hide remove button for the removed product
            const productElements = document.querySelectorAll('.product');
            productElements.forEach(product => {
                if (product.querySelector('.name').textContent === productName) {
                    product.querySelector('.remove-from-cart-button').style.display = 'none';
                }
            });
        }

        function showNotification(message) {
            alert(message);
        }

        function updateTotalCostUI() {
            // Assuming you have an element with id 'totalCostValue' to display the total cost
            const totalCostElement = document.getElementById('totalCostValue');
            if (totalCostElement) {
                let totalCost = parseFloat(localStorage.getItem('totalCost')) || 0;
                totalCostElement.textContent = totalCost.toFixed(2);
            }
        }
        
    </script>
